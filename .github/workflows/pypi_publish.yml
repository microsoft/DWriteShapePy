# This is a basic workflow to help you get started with Actions

name: Build, Test and Publish

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    tags:
      - "v*"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-n-publish:
    # The type of runner that the job will run on
    runs-on: windows-2022
    
    env:
      CIBW_BUILD: cp39-win_amd64 cp310-win_amd64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64
      CIBW_ARCHS: AMD64
      CIBW_PLATFORM: windows
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.9"
      CIBW_TEST_REQUIRES: pytest
      CIBW_TEST_COMMAND: "pytest {project}/tests"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
         # Version range or exact version of a Python version to use, using SemVer's version range syntax.
         python-version: "3.12"
         # The target architecture (x86, x64) of the Python interpreter.
         architecture: "x64"
         
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install cibuildwheel
          pip install cython twine
          
      - name: Build Wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        
      - name: Upload Wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./wheelhouse/*.whl
          name: wheels-artifact
          
      - name: Build Source Distribution 
        # Updated to ensure the source distribution is created with the .tar.gz extension
        run: python setup.py sdist --formats=gztar
          
      - name: Upload Source Distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Updated the path to match the new .tar.gz file extension
          path: ./dist/*.tar.gz
          name: source-dist-artifact

  upload_pypi:
     needs: [build-n-publish]
     runs-on: ubuntu-latest
     environment:
      name: pypi  # Ensure this matches the environment name configured in PyPI
      url: https://pypi.org/project/dwriteshapepy/  # Corrected URL format for PyPI project page
     permissions:
       id-token: write  # Ensure this is set correctly for trusted publishing
     if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # Corrected condition to check for tag format
     steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-artifact
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-dist-artifact
          path: dist

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
